name: Update PokéDB Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

concurrency:
  group: update-pokedb-data
  cancel-in-progress: false

jobs:
  build-and-push-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e .

      - name: Generate and validate every generation
        run: python -m pokedb --all --gen all --no-cache --force

      - name: Prepare data branch
        run: |
          git worktree add --detach data-branch origin/data
          find data-branch -maxdepth 1 -type d -name 'gen*' -exec rm -rf {} +
          cp -R .output/gen* data-branch/
          cp .github/data-branch-README.md data-branch/README.md

      - name: Commit and push data
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md gen*
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Regenerate schema v3 data: $(date -u +'%Y-%m-%d')"
          git push origin HEAD:data
